name: project_management_dashboard
description: "Professional Flutter and Firebase project management dashboard with private task notifications."
publish_to: 'none'
version: 1.4.271+271

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.5.6
  google_sign_in: ^6.2.2
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.3
  http: ^1.6.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.0
  url_launcher: ^6.3.2
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  lottie: ^3.3.3
  pdf: ^3.11.3
  printing: ^5.14.3
  web: ^1.1.1
  provider: ^6.1.5+1
  razorpay_flutter: ^1.4.5
  file_picker: ^8.1.2
  onesignal_flutter: ^5.3.0 # Add this line


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/menu_in_out.json
